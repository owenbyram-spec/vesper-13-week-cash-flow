[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vesper-13-week-cash-flow"
version = "0.1.0"
description = "Vesper & Co 13-Week Cash Flow for fractional CFOs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1", "keyring==25.7.0", "openpyxl==3.1.5"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[tool.setuptools.packages.find]
include = ["vesper_cashflow*"]

[tool.setuptools.package-data]
vesper_cashflow = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
